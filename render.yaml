services:
  # FastAPI backend (HTTP + WebSocket API)
  - type: web
    name: codefix-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: codefix_ai
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # e.g. https://codefix-ai-frontend.onrender.com
      - key: JDOODLE_CLIENT_ID
        sync: false
      - key: JDOODLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # y-websocket collaboration server
  - type: web
    name: codefix-ai-collab
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node collab-server.cjs
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SAVE_DEBOUNCE_WAIT
        value: "2000"
      - key: SAVE_DEBOUNCE_MAXWAIT
        value: "10000"

  # Vite + React frontend (static build served by CDN)
  - type: web
    name: codefix-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    buildFilter:
      paths:
        - frontend/**
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_COLLAB_URL
        sync: false # e.g. wss://codefix-ai-collab.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

